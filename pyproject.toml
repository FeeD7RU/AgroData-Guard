[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agrodata-guard"
version = "0.1.0"
description = "Auditable, transport-independent sensor quality agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "sqlalchemy>=2.0,<2.1",
  "pydantic>=2.10,<3", "numpy>=2.1,<3", "scikit-learn>=1.6,<2",
  "httpx>=0.28,<1", "paho-mqtt>=2.1,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]
mqtt-test = ["amqtt==0.11.3"]

[project.scripts]
agroguard = "agroguard.cli:main"

[tool.setuptools.packages.find]
include = ["agroguard*"]

[tool.setuptools.package-data]
agroguard = ["static/*", "defaults.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
